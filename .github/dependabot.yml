version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 5
    # Supply-chain cooldown: don't propose a version until it's been public a
    # few days, so a just-published compromised release (chalk/debug-style)
    # isn't pulled in immediately.
    cooldown:
      default-days: 5
    reviewers:
      - 'JNZader'
    assignees:
      - 'JNZader'
    labels:
      - 'dependencies'
      - 'automated'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    # Lockstep families FIRST: coupled packages update together in ONE PR
    # (including majors) so a partial bump can't break peer-version typechecks
    # (the AI-SDK coupled-majors scar, ghagga #289). A dep lands in the first
    # group it matches, so these precede the minor-and-patch catch-all.
    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      radix-ui:
        patterns:
          - '@radix-ui/*'
      next:
        patterns:
          - 'next'
      # Everything else: minor+patch batched to reduce PR noise (majors solo).
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore'
      include: 'scope'
