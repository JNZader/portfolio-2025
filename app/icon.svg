<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="JZ">
  <style>
    .bg { fill: oklch(98% 0 0); }
    .s1 { stop-color: oklch(50% 0.2 250); }
    .s2 { stop-color: oklch(55% 0.2 300); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: oklch(10% 0 0); }
      .s1 { stop-color: oklch(70% 0.18 250); }
      .s2 { stop-color: oklch(65% 0.2 300); }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="7" />
  <defs>
    <linearGradient id="jz-grad" x1="0" y1="0" x2="1" y2="1">
      <stop class="s1" offset="0%" />
      <stop class="s2" offset="100%" />
    </linearGradient>
  </defs>
  <text
    x="50%"
    y="50%"
    dy="0.06em"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Space Grotesk', system-ui, -apple-system, sans-serif"
    font-weight="700"
    font-size="17"
    letter-spacing="-0.5"
    fill="url(#jz-grad)"
  >JZ</text>
</svg>
