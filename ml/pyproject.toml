[project]
name = "portfolio-ft"
version = "0.1.0"
description = "RAG-style LoRA fine-tune for the portfolio's in-browser chat model"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.3",
  "onnx>=1.17",
  "numpy>=2.1",
]
train = [
  "torch>=2.7",
  "transformers>=4.46",
  "peft>=0.13",
  "trl>=0.12",
  "datasets>=3.0",
  "accelerate>=1.0",
]
publish = [
  "huggingface_hub>=0.26",
]
export = [
  "onnxruntime>=1.30",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portfolio_ft"]
