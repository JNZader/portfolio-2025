schema: spec-driven

context: |
  Tech stack: Next.js 16 App Router, React 19, TypeScript 6 strict, Tailwind CSS 4, next-intl, Sanity, Prisma/PostgreSQL.
  Architecture: App Router route segments under app/[locale], shared components, lib services/utilities, Server Actions and API routes.
  Testing: Vitest + Testing Library + happy-dom for unit/integration; Playwright multi-browser E2E and axe-core; v8 coverage thresholds.
  Style: Biome formatting/linting, single quotes in TypeScript, 2-space indentation, Conventional Commits, localized copy via messages/{es,en}.json.
  TDD: Strict RED-GREEN-REFACTOR is supported by the existing test stack and conventions, but is not currently enforced by tooling.

execution_mode: auto
delivery_strategy: auto-forecast
review_budget_changed_lines: 800

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
    - Use strict RED-GREEN-REFACTOR when tests are applicable
    tdd: true
    test_command: npm run test:run
  verify:
    test_command: npm run test:run
    build_command: npm run build
    coverage_threshold: 35
  archive:
    - Warn before merging destructive deltas (large removals)
